version: 2

models:
  - name: mart_customer_360
    description: "Master Customer 360 Dimension - 1 Row per user_id"
    columns:
      - name: user_id
        description: "Primary Key"
        tests:
          - unique
          - not_null

      - name: email
        tests:
          - not_null

      - name: account_health_status
        tests:
          - not_null
          - accepted_values:
              values: ['Highly Active', 'Dormant', 'Churned', 'Inactive / New']

      - name: customer_value_tier
        tests:
          - not_null
          - accepted_values:
              values: ['Tier 1 (VIP)', 'Tier 2 (Gold)', 'Tier 3 (Standard)', 'zero_balance']

      - name: is_overdrawn_flag
        tests:
          - not_null

  - name: fct_banking_transactions
    description: "Fact Table for Transactions - 1 Row per transaction_id"
    columns:
      - name: transaction_id
        description: "Primary Key"
        tests:
          - unique
          - not_null

      - name: user_id
        description: "Foreign Key linking to Customer 360"
        tests:
          - not_null
          - relationships:
              to: ref('mart_customer_360')
              field: user_id

      - name: amount
        tests:
          - not_null